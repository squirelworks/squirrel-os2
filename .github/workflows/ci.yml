# Checks every pull request and every push to main.
#
#   build    tools/build.sh --fresh and the string/font table checks. About a
#            minute; the first signal that a PR at least assembles.
#   regress  tools/regress.sh, the full scripted QEMU run, with OVMF so the
#            UEFI checks run as well. This is the check to wait for before a
#            merge: a green "regress" means every check in regress.sh passed.
#
# A newer push to the same PR cancels the run still going for the older one.
# The SquirrelBIOS UEFI check (uefi-squirrelbios) is skipped here: it needs
# SQUIRRELBIOS_FD and is retried because it sometimes misses BOOTX64.EFI.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nasm

      - name: Build the images
        run: |
          tools/build.sh --fresh
          python3 tools/mkfont.py --check
          (cd build && sha256sum os.img floppy.img data.img cd.iso uefi.img) | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the images
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: |
            build/os.img
            build/floppy.img
            build/data.img
            build/cd.iso
            build/uefi.img
          retention-days: 7

  regress:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain, QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            nasm python3 qemu-system-x86 ovmf ovmf-ia32

      - name: tools/regress.sh
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          start=$(date +%s)
          set +e
          tools/regress.sh 2>&1 | tee regress.log
          status=${PIPESTATUS[0]}
          set -e
          mins=$(( ($(date +%s) - start + 59) / 60 ))
          {
            echo "### regress.sh: $(grep -c '^ok ' regress.log) ok, $(grep -c '^FAIL ' regress.log) FAIL, $(grep -c '^skip ' regress.log) skipped, ${mins} min"
            if grep -q '^FAIL ' regress.log; then
              echo '```'
              grep '^FAIL ' regress.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL ' regress.log | sed 's/^FAIL \([^ ]*\)\(.*\)/::error title=regress \1::\1\2/' || true
          exit $status

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-log
          path: regress.log
          if-no-files-found: ignore
          retention-days: 14
